media:
  - name: images
    label: Images
    input: public/images
    output: /images
    extensions: [jpg, jpeg, png, webp]
    rename: safe

content:
  - name: settings
    label: Site Settings
    type: file
    path: src/content/settings.json
    format: json
    fields:
      - name: name
        label: Studio Name
        type: string
        required: true
      - name: tagline
        label: Tagline
        type: string
      - name: teacherName
        label: Teacher Name
        type: string
      - name: email
        label: Email Address
        type: string
      - name: location
        label: Location
        type: string
      - name: socials
        label: Social Links
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{label}"
        fields:
          - name: label
            label: Label
            type: string
          - name: url
            label: URL
            type: string

  - name: home
    label: Home Page
    type: file
    path: src/content/pages/home.json
    format: json
    fields:
      - name: heroEyebrow
        label: Hero Eyebrow
        type: string
      - name: heroTitle
        label: Hero Title
        type: string
      - name: intro
        label: Intro
        type: text
      - name: invitationEyebrow
        label: Invitation Eyebrow
        type: string
      - name: invitationTitle
        label: Invitation Title
        type: string
      - name: invitationText
        label: Invitation Paragraphs
        type: text
        list: true
      - name: cards
        label: Feature Cards
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            type: string
          - name: description
            type: text
          - name: href
            label: Link Path
            type: string
          - name: linkLabel
            label: Link Label
            type: string
          - name: imageKey
            label: Image Key
            type: select
            options:
              values:
                - value: classOne
                  label: First Class Image
                - value: privateSession
                  label: Private Session Image
                - value: contact
                  label: Contact Detail Image
      - name: images
        label: Page Images
        type: object
        fields:
          - name: hero
            label: Hero Image
            type: object
            fields: &imageFields
              - name: src
                label: Image File
                type: image
                options:
                  media: images
              - name: alt
                label: Alt Text
                type: string
              - name: label
                label: Internal Image Label
                type: string
              - name: size
                label: Editor Size Note
                type: string
              - name: width
                label: Image Width
                type: number
              - name: height
                label: Image Height
                type: number
          - name: invitation
            label: Invitation Image
            type: object
            fields: *imageFields
          - name: privateSession
            label: Private Session Card Image
            type: object
            fields: *imageFields
          - name: contact
            label: Contact Card Image
            type: object
            fields: *imageFields

  - name: about
    label: About Page
    type: file
    path: src/content/pages/about.json
    format: json
    fields:
      - name: eyebrow
        type: string
      - name: title
        type: string
      - name: bio
        type: text
      - name: philosophyTitle
        label: Philosophy Heading
        type: string
      - name: philosophy
        label: Philosophy Cards
        type: string
        list: true
      - name: experienceTitle
        label: Experience Heading
        type: string
      - name: experienceText
        label: Experience Paragraphs
        type: text
        list: true
      - name: image
        label: About Page Image
        type: object
        fields: *imageFields

  - name: classes
    label: Classes Page
    type: file
    path: src/content/pages/classes.json
    format: json
    fields:
      - name: eyebrow
        type: string
      - name: title
        type: string
      - name: intro
        type: text
      - name: classes
        label: Class Offerings
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            type: string
          - name: description
            type: text
          - name: image
            type: object
            fields: *imageFields
      - name: bringTitle
        label: What To Bring Heading
        type: string
      - name: bringText
        label: What To Bring Paragraphs
        type: text
        list: true
      - name: detailImage
        label: Detail Image
        type: object
        fields: *imageFields
      - name: safetyTitle
        label: Safety Heading
        type: string
      - name: safetyText
        label: Safety Text
        type: text
      - name: faqTitle
        label: FAQ Heading
        type: string
      - name: faqItems
        label: FAQ Items
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{question}"
        fields: &faqFields
          - name: question
            label: Question
            type: string
          - name: answer
            label: Answer
            type: text

  - name: privateSessions
    label: Private Sessions Page
    type: file
    path: src/content/pages/private-sessions.json
    format: json
    fields:
      - name: eyebrow
        type: string
      - name: title
        type: string
      - name: intro
        type: text
      - name: bulletsTitle
        label: Bullets Heading
        type: string
      - name: bullets
        label: Private Session Bullets
        type: string
        list: true
      - name: pricingEyebrow
        label: Pricing Eyebrow
        type: string
      - name: pricing
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{label}: {price}"
        fields:
          - name: label
            type: string
          - name: price
            type: string
      - name: safetyTitle
        label: Boundaries And Safety Heading
        type: string
      - name: safetyText
        label: Boundaries And Safety Paragraphs
        type: text
        list: true
      - name: beforeTitle
        label: Before Session Heading
        type: string
      - name: beforeText
        label: Before Session Paragraphs
        type: text
        list: true
      - name: faqTitle
        label: FAQ Heading
        type: string
      - name: faqItems
        label: FAQ Items
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{question}"
        fields: *faqFields
      - name: image
        label: Hero Image
        type: object
        fields: *imageFields
      - name: detailImage
        label: Detail Image
        type: object
        fields: *imageFields

  - name: contact
    label: Contact Page
    type: file
    path: src/content/pages/contact.json
    format: json
    fields:
      - name: eyebrow
        type: string
      - name: title
        type: string
      - name: intro
        type: text
      - name: locationTitle
        label: Location Heading
        type: string
      - name: privacyTitle
        label: Privacy Heading
        type: string
      - name: privacyText
        label: Privacy Text
        type: text
      - name: socialTitle
        label: Social Heading
        type: string
      - name: image
        label: Contact Image
        type: object
        fields: *imageFields

settings:
  hide: false
